name: Windows CI

# Compiles and tests the Rust workspace on Windows for branches `win/**`.
# The Tauri app crate is built separately once the UI bundle exists; this
# job covers the audio, STT and LLM crates, which are the Windows risk.
# Same static-CRT env as release.yml (see the comment there).

on:
  push:
    branches:
      - "win/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: windows-latest
    env:
      LLAMA_STATIC_CRT: "1"
      CMAKE_MSVC_RUNTIME_LIBRARY: MultiThreaded
      RUSTFLAGS: "-C target-feature=+crt-static"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        shell: pwsh
        run: rustup show

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Format
        run: cargo fmt --all --check

      - name: Check libraries
        run: cargo check --locked -p myna-wasapi-probe -p myna-audio -p myna-stt -p myna-llm

      - name: Test libraries
        run: cargo test --locked -p myna-wasapi-probe -p myna-audio -p myna-stt -p myna-llm
