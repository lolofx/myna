name: Windows CI

# Compiles and tests the Windows build for branches `win/**`: the audio, STT
# and LLM crates (job `rust`), then the Tauri app crate and the UI bundle it
# embeds (job `app`). Same static-CRT env as release.yml (see the comment
# there).

on:
  push:
    branches:
      - "win/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: windows-latest
    env:
      LLAMA_STATIC_CRT: "1"
      CMAKE_MSVC_RUNTIME_LIBRARY: MultiThreaded
      RUSTFLAGS: "-C target-feature=+crt-static"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        shell: pwsh
        run: rustup show

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Format
        run: cargo fmt --all --check

      - name: Check libraries
        run: cargo check --locked -p myna-wasapi-probe -p myna-audio -p myna-stt -p myna-llm

      # Serial: the audio tests enumerate devices through cpal/COM, and
      # CLAUDE.md requires device-touching tests to run one at a time.
      # The `system_sources_naming` tests are skipped here and run in the
      # informational step below: the hosted runner has no audio endpoint
      # and the test binary dies with STATUS_ACCESS_VIOLATION there, which
      # would otherwise hide every other result.
      - name: Test libraries
        run: >
          cargo test --locked -p myna-wasapi-probe -p myna-audio -p myna-stt -p myna-llm --
          --test-threads=1
          --skip all_output_source
          --skip no_source_name_looks
          --skip application_sources_are_sorted
          --skip current_process_is_never

      - name: Device enumeration tests (informational, needs real audio hardware)
        continue-on-error: true
        run: cargo test --locked -p myna-audio --test system_sources_naming -- --test-threads=1 --nocapture

  # UI checks are platform-neutral and `npm test` uses POSIX env syntax, so
  # they run on Linux rather than under Windows' cmd.exe.
  ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Typecheck, lint, test
        working-directory: ui
        run: |
          npm run typecheck
          npm run lint
          npm test -- --watch=false

  app:
    runs-on: windows-latest
    env:
      LLAMA_STATIC_CRT: "1"
      CMAKE_MSVC_RUNTIME_LIBRARY: MultiThreaded
      RUSTFLAGS: "-C target-feature=+crt-static"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        shell: pwsh
        run: rustup show

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: Install root dependencies (Tauri CLI)
        run: npm ci

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      # The Tauri crate embeds ../../ui/dist, so the bundle must exist first.
      - name: Build UI
        run: npm run ui:build

      - name: Check app crate
        run: cargo check --locked -p myna-app --all-targets

      - name: Test app crate
        run: cargo test --locked -p myna-app -- --test-threads=1
