<div class="update-consent-backdrop">
  <div class="update-consent-dialog" role="dialog" aria-modal="true" aria-labelledby="update-consent-title">
    <button type="button" class="close" [attr.aria-label]="'common.close' | transloco" (click)="dismiss()">&times;</button>

    <h2 id="update-consent-title">{{ 'updateConsent.title' | transloco }}</h2>

    <p>{{ 'updateConsent.intro' | transloco }}</p>

    <p>{{ 'updateConsent.exception' | transloco }}</p>

    <p>{{ 'updateConsent.ifOn' | transloco }}</p>

    <ul>
      <li [innerHTML]="'updateConsent.sendsIp' | transloco"></li>
      <li [innerHTML]="'updateConsent.sendsNothing' | transloco"></li>
    </ul>

    <p>{{ 'updateConsent.noVersion' | transloco }}</p>

    <p [innerHTML]="'updateConsent.onlyTells' | transloco"></p>

    @if (!signed() && macos()) {
      <p class="caveat" [innerHTML]="'updateConsent.macCaveat' | transloco"></p>
    }

    <div class="actions">
      <button type="button" class="grant" (click)="grant()">{{ 'updateConsent.grant' | transloco }}</button>
      <button type="button" class="decline" (click)="decline()">{{ 'updateConsent.decline' | transloco }}</button>
    </div>

    <p class="footer">{{ 'updateConsent.footer' | transloco }}</p>
  </div>
</div>
