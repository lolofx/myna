@if (editing()) {
  <textarea
    #segmentInput
    class="segment-input"
    rows="1"
    [attr.aria-label]="'transcript.segmentText' | transloco"
    [value]="draft()"
    (input)="onInput($event)"
    (keydown)="onKeydown($event)"
    (blur)="commit()"
  ></textarea>
} @else if (editable()) {
  <button type="button" class="segment-trigger" (click)="beginEdit()">{{ text() }}</button>
} @else {
  <span class="segment-text">{{ text() }}</span>
}
