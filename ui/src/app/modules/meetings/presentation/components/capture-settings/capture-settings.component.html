<div class="capture-settings">
  <button
    type="button"
    class="trigger"
    [attr.aria-expanded]="expanded()"
    [disabled]="disabled()"
    (click)="toggle()"
  >
    {{ triggerLabel() }}
    <span class="chevron" aria-hidden="true">&#9662;</span>
  </button>

  @if (expanded()) {
    <div class="popover" role="group" [attr.aria-label]="'capture.settings' | transloco">
      <label class="device-label" for="capture-device">{{ 'capture.microphone' | transloco }}</label>
      <select
        id="capture-device"
        class="device-select"
        [attr.aria-label]="'capture.microphone' | transloco"
        (change)="onDeviceChange($event)"
        [disabled]="disabled() || captureSource() === 'system'"
      >
        @for (device of devices(); track device.name) {
          <option [value]="device.name" [selected]="device.name === selectedDevice()?.name">
            {{ device.name }}
          </option>
        }
      </select>

      <span class="device-label">{{ 'capture.systemAudio' | transloco }}</span>
      <app-searchable-select
        class="audio-source-select"
        [options]="audioSources()"
        [selectedId]="selectedAudioSource()"
        [placeholder]="'capture.searchApps' | transloco"
        [ariaLabel]="'capture.systemAudio' | transloco"
        [disabled]="disabled() || captureSource() === 'microphone'"
        (selectionChange)="onAudioSourceChange($event)"
      />

      <app-capture-source-picker
        [captureSource]="captureSource()"
        [systemAudioStatus]="systemAudioStatus()"
        [selectedDeviceName]="selectedDevice()?.name ?? null"
        [devices]="devices()"
        [disabled]="disabled()"
        (sourceSelected)="onSourceSelected($event)"
        (fallbackMicSelected)="deviceChanged.emit($event)"
        (permissionRequested)="permissionRequested.emit()"
      />
    </div>
  }
</div>
