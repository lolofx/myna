<div class="summary-instructions">
  @if (!forceExpanded()) {
    <button
      type="button"
      class="toggle"
      [attr.aria-expanded]="expanded()"
      (click)="toggleExpanded()"
    >
      {{ (expanded() ? 'summary.instructions' : 'summary.addInstructions') | transloco }}
    </button>
  }

  @if (expanded()) {
    <label class="instructions-field">
      <span class="instructions-label">{{ 'summary.instructions' | transloco }}</span>
      <textarea
        class="instructions-input"
        rows="3"
        [value]="text()"
        (input)="onTextInput($event)"
        (blur)="onTextBlur()"
      ></textarea>
    </label>

    <label class="include-general">
      <input
        type="checkbox"
        [checked]="draft().includeGeneral"
        (change)="onIncludeGeneralToggled($event)"
      />
      {{ 'summary.applyGeneral' | transloco }}
    </label>

    @if (showGuidelinesHint()) {
      <p class="guidelines-hint">{{ 'summary.generalGuidelines' | transloco: { preview: guidelinesPreview() } }}</p>
    }

    @if (showRemove()) {
      <button type="button" class="remove-instructions" (click)="clearInstructions()">{{ 'summary.removeInstructions' | transloco }}</button>
    }
  }
</div>
