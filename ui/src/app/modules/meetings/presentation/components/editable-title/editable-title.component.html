@if (editing()) {
  <input
    #titleInput
    type="text"
    class="title-input"
    [attr.aria-label]="'meetings.title' | transloco"
    [value]="draft()"
    (input)="onInput($event)"
    (keydown)="onKeydown($event)"
    (blur)="commit()"
  />
} @else {
  <button type="button" class="title-trigger" (click)="beginEdit()">
    {{ title() }}
  </button>
}
