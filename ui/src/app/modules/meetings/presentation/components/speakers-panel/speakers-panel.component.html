<section class="speakers-panel" [attr.aria-label]="'speakers.title' | transloco">
  <h3 class="panel-title">{{ 'speakers.title' | transloco }}</h3>
  <ul class="speaker-rows">
    @for (row of rows(); track row.label) {
      <li class="speaker-row">
        <span class="speaker-role">{{ row.removable ? ('speakers.speaker' | transloco) : ('speakers.me' | transloco) }}</span>
        <input
          type="text"
          class="speaker-name"
          [value]="row.name"
          [placeholder]="row.removable ? ('speakers.unnamed' | transloco) : ('speakers.you' | transloco)"
          [attr.aria-label]="'speakers.displayNameFor' | transloco: { name: row.name !== '' ? row.name : row.label }"
          (change)="commitRename(row, $event)"
          (keyup.enter)="commitRename(row, $event)"
        />
        @if (row.removable) {
          <button type="button" class="remove-speaker" (click)="remove(row)">{{ 'speakers.remove' | transloco }}</button>
        }
      </li>
    }
  </ul>
  <button
    type="button"
    class="undo-speaker-op"
    [disabled]="history().length === 0"
    (click)="undoRequested.emit()"
  >
    {{ undoLabel() }}
  </button>
</section>
