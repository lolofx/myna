<label class="picker" for="summary-language" [attr.title]="'settings.summaryLanguage.title' | transloco">
  <span class="label visually-hidden">{{ 'settings.summaryLanguage.title' | transloco }}</span>
  <select
    id="summary-language"
    [attr.aria-label]="'settings.summaryLanguage.ariaLabel' | transloco"
    [disabled]="disabled() || languages().length === 0"
    (change)="onChange($event)"
  >
    @for (language of languages(); track language.code) {
      <option [value]="language.code" [selected]="language.code === selectedLanguage()">
        {{ language.label }}
      </option>
    }
  </select>
</label>
