@if (state() === 'idle') {
  <button
    type="button"
    class="record"
    [disabled]="disabled() || startingRecording()"
    [attr.aria-busy]="startingRecording()"
    (click)="recordClicked.emit()"
  >
    @if (startingRecording()) {
      <span class="spinner" aria-hidden="true"></span>
      {{ 'record.preparing' | transloco }}
    } @else {
      {{ 'record.record' | transloco }}
    }
  </button>
} @else {
  <button
    type="button"
    class="stop"
    [disabled]="state() === 'stopping'"
    [attr.aria-busy]="state() === 'stopping'"
    (click)="stopClicked.emit()"
  >
    @if (state() === 'stopping') {
      <span class="spinner" aria-hidden="true"></span>
      {{ 'record.finalizing' | transloco }}
    } @else {
      {{ 'record.stop' | transloco }}
    }
  </button>
  <button
    type="button"
    class="cancel"
    [disabled]="state() === 'stopping'"
    (click)="cancelClicked.emit()"
  >
    {{ 'common.cancel' | transloco }}
  </button>
}
